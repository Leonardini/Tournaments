[project]
name = "tournaments-repro"
version = "1.0.0"
description = "Reproducibility package for 'Tournaments not inducible by three voters' (Chindelevitch & Harutyunyan)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Everything the package's Python scripts import, outside the standard library.
# It is free and pip-installable; no headline result needs anything else.
dependencies = [
    "ortools>=9.10",   # CP-SAT: the sec5 realizability checks
]

[project.optional-dependencies]
# Only for the n = 9 obstacle catalogue (appendices/obstacle_catalogue/). pycddlib 3 needs the cddlib
# and GMP C libraries installed first (e.g. `brew install cddlib gmp`).
obstacles = ["numpy>=1.26", "pycddlib>=3.0", "python-igraph>=0.11", "networkx>=3.2"]

# NOTE: IBM CPLEX is deliberately NOT listed. The `cplex` package on PyPI is the
# community edition, which caps models at 1000 variables and is too small for the
# scripts here. Install the full CPLEX Studio and its bindings by hand if you want
# the eight optional CPLEX scripts; each one has a free twin (see README).

[tool.uv]
package = false        # this is a collection of scripts, not an importable package
